<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hunnar House | Handmade Gifts & Candles</title>
  <meta name="description" content="Shop beautiful handmade gifts, yummy chocolates, and sweet-smelling candles for every celebration." />
  
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dpeijmtb6/image/upload/v1791132164/logo_hunnar_house_b5hefn.png" />
  <meta name="google-site-verification" content="bsO3Wcmwg8HeskQwjh50f8aGdXcOBYx1ygl2lnGT0DM" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #6B1D2F;
      --primary-dark: #47111D;
      --accent: #C28490;
      --surface: #FAF7F2;
      --card-bg: #FFFFFF;
      --text: #2D2522;
      --muted: #6B625E;
      --border: #EFE9DF;
      --glow-1: rgba(194, 132, 144, 0.45);
      --glow-2: rgba(255, 214, 165, 0.4);
      --glow-3: rgba(212, 175, 55, 0.25);
      --door-bg: #ffffff;
      --door-fig: #36221E;
    }

    [data-theme="amber"] {
      --primary: #8C4A1A;
      --primary-dark: #592B0B;
      --accent: #D98850;
      --glow-1: rgba(217, 136, 80, 0.45);
      --glow-2: rgba(255, 230, 168, 0.5);
      --glow-3: rgba(230, 175, 46, 0.3);
    }

    [data-theme="wine"] {
      --primary: #4A1220;
      --primary-dark: #290810;
      --accent: #8E354A;
      --glow-1: rgba(142, 53, 74, 0.5);
      --glow-2: rgba(214, 143, 161, 0.35);
      --glow-3: rgba(179, 102, 122, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      background-color: var(--surface);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
      color: var(--primary-dark);
    }

    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* ================= BACKGROUND GLOWING ORBS ================= */
    .animated-orb-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.75;
      animation: floatOrbit 18s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      background: var(--glow-1);
      top: -50px;
      left: -80px;
    }

    .orb-2 {
      width: 550px;
      height: 550px;
      background: var(--glow-2);
      top: 30%;
      right: -120px;
      animation-duration: 22s;
    }

    .orb-3 {
      width: 400px;
      height: 400px;
      background: var(--glow-3);
      bottom: -60px;
      left: 20%;
      animation-duration: 16s;
    }

    @keyframes floatOrbit {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 80px) scale(1.15); }
      100% { transform: translate(-50px, 40px) scale(0.95); }
    }

    /* ================= HEADER ================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(107, 29, 47, 0.08);
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 5%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .brand-logo-container {
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .brand-logo {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--primary); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-picker {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px 8px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      outline: 2px solid transparent;
      transition: outline 0.2s;
    }

    .theme-dot.rose { background: #6B1D2F; }
    .theme-dot.amber { background: #8C4A1A; }
    .theme-dot.wine { background: #4A1220; }
    .theme-dot.active { outline-color: var(--primary); }

    .icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .icon-btn:hover { transform: translateY(-2px); color: var(--primary); }

    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    /* ================= HERO SECTION & ORGANIC BLOB ================= */
    .hero-section {
      position: relative;
      z-index: 1;
      padding: 60px 5%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 40px;
      min-height: 80vh;
    }

    .hero-text h1 {
      font-size: 3rem;
      line-height: 1.18;
      margin-bottom: 18px;
    }

    .hero-text p {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 28px;
      max-width: 500px;
    }

    .hero-cta {
      display: flex;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .btn-secondary {
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }

    .btn-secondary:hover { background: rgba(194, 132, 144, 0.15); }

    /* REAL ORGANIC BLOB CONTAINER */
    .blob-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .organic-blob-frame {
      width: 380px;
      height: 480px;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.6s ease;
      filter: drop-shadow(0 15px 35px rgba(107, 29, 47, 0.18));
    }

    .blob-inner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: url(#organicBlobMask);
      transition: clip-path 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.7s ease;
    }

    /* Morph to Circle on Hover / Focus */
    .organic-blob-frame:hover .blob-inner-img,
    .organic-blob-frame:focus .blob-inner-img {
      clip-path: circle(48% at 50% 50%);
      transform: scale(1.05);
    }

    .organic-blob-frame:hover,
    .organic-blob-frame:focus {
      transform: scale(1.03);
      filter: drop-shadow(0 0 25px var(--accent)) drop-shadow(0 0 45px rgba(212, 175, 55, 0.4));
    }

    /* ================= SINGLE COLUMN SHOP ================= */
    .shop-section {
      position: relative;
      z-index: 1;
      padding: 70px 5%;
      max-width: 860px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-header h2 { font-size: 2.3rem; margin-bottom: 6px; }
    .section-header p { color: var(--muted); }

    .search-filter-box {
      margin-bottom: 30px;
      display: flex;
      gap: 12px;
    }

    .search-filter-box input {
      flex-grow: 1;
      padding: 12px 18px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 1rem;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .single-col-catalog {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .single-col-card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      display: grid;
      grid-template-columns: 280px 1fr;
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid var(--border);
    }

    .single-col-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .card-img-wrap {
      height: 100%;
      min-height: 220px;
      position: relative;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-content h3 { font-size: 1.4rem; margin-bottom: 6px; }
    .card-content p { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .card-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* ================= USER PROFILE & ADDRESS CARD ================= */
    .profile-section {
      display: none;
      position: relative;
      z-index: 1;
      padding: 50px 5%;
      max-width: 860px;
      margin: 0 auto;
    }

    .profile-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }

    .profile-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .address-edit-box {
      margin-top: 20
